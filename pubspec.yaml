name: endelea
description: "Gym workout tracker: programs, guided sessions and progress."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  archive: ^4.7.1
  bloc: ^9.2.1
  cupertino_ui: ^1.1.7
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  equatable: ^3.0.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  fl_chart: ^1.3.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_local_notifications: ^23.0.3
  flutter_localizations:
    sdk: flutter
  go_router: ^18.1.4
  google_fonts: ^9.0.0
  google_sign_in: ^7.2.0
  googleapis: ^19.0.0
  intl: ^0.20.3
  material_ui: ^1.11.1
  path_provider: ^2.1.6
  phosphor_flutter:
    path: third_party/phosphor_flutter
  shared_preferences: ^2.5.6
  timezone: ^0.11.2
  uuid: ^4.6.0
  wakelock_plus: ^1.8.2

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.16.1
  drift_dev: ^2.35.3
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/
